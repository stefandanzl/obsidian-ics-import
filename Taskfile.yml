# https://taskfile.dev

######################## QUICK START ###########################
#  1 Change placeholder values in manifest.json and package.json
#  2 Copy .env-example to .env and modify for your dev vault
#  3 Install Taskfile from https://taskfile.dev/installation
#  4 Run `task init`
#  After modifying code just run the command "task" to build
#  and test it in your dev Obsidian vault after reloading it
version: "3"
vars:
  PLUGIN_ID:
    sh: node -e "console.log(require('./manifest.json').id)"
  PLUGIN_NAME:
    sh: node -e "console.log(require('./manifest.json').name)"
  PLUGIN_DESCRIPTION:
    sh: node -e "console.log(require('./manifest.json').description)"
  AUTHOR_NAME:
    sh: node -e "console.log(require('./manifest.json').author)"

  DIR_PLUGIN: "{{.VAULTS_DIR}}/{{.VAULT_NAME}}/.obsidian/plugins/{{.PLUGIN_ID}}"
  VERSION:
    sh: node -e "console.log(require('./package.json').version)"
  # CURRENT_TAG:
  #   sh: git describe --tags --abbrev=0
  START_TIME:
    sh: date +%H:%M:%S.%3N

  FILES:
    - "main.js"
    - "manifest.json"
    - "styles.css"

# These can be overridden permanently with .env file!
# See esbuild.config.mjs for ENV implementation details
env:
  SOURCEMAP: "0"
  NO_MINIFY: "0"
  DROP_LOGS: "0"
  ANALYZE_META: "1"

dotenv: [".env"] # Copy .env-example to .env and modify according your Obsidian setup

tasks:
  ####################################### DEVELOPMENT #######################################
  default:
    desc: This is the standard task to use during development, just run "task" command
    cmds:
      - task: build
      - task: load

  debug:
    desc: For in-depth plugin debugging with Obsidian's Devtools create builds with this task.
    aliases: [debugging, devtools]
    env:
      SOURCEMAP: "1"
      NO_MINIFY: "1"
      DROP_LOGS: "0"
      ANALYZE_META: "1"
    cmds:
      - npm run build
      - task: load

  build: npm run build

  load:
    desc: Tasks to be done after bundling build to load new version in Obsidian
    aliases: [post-build, post, load]
    cmds:
      - task: copy
      - task: reload-app
      - task: bundle-size
      - task: date

  copy:
    desc: Copies the build files to plugin folder in Obsidian, if folder exists and .env file is set up.
    requires:
      vars: [VAULTS_DIR, VAULT_NAME]
    silent: true
    cmds:
      - mkdir -p {{.DIR_PLUGIN}}
      - for: { var: FILES }
        cmd: cp '{{.ITEM}}' '{{.DIR_PLUGIN}}/{{.ITEM}}'

  reload-plugin:
    desc: "Reload only your plugin"
    aliases: [plugin]
    cmd: obsidian plugin:reload id={{.PLUGIN_ID}}

  reload-app:
    desc: "Reload entire Obsidian app"
    aliases: [app, reload-obsidian]
    silent: true
    cmd: obsidian command id=app:reload

  ####################################### TOOLING #######################################
  bundle-size:
    aliases: [bundle, size]
    silent: true
    ignore_error: true
    vars:
      BUNDLE_SIZE:
        sh: node -e "console.log(require('./meta.json').outputs['main.js'].bytes)"
    cmd: echo '{{.BUNDLE_SIZE}} bytes'

  dev: npm run dev

  git:
    desc: Commit all changes
    cmds:
      - git add .
      - git commit -m "task"
      - git push

  lint:
    desc: Lints all ts and js in src/ folder. May require `npm install -g eslint`
    aliases: [linter]
    cmd: eslint src/.

  unused:
    desc: Find unused functions and classes in the codebase
    cmd: npx ts-unused-exports tsconfig.json

  minify:
    silent: true
    cmds:
      - terser main.js -o main.min.js
      - "echo main.js $(wc -c < main.js) Bytes"
      - "echo main.min.js $(wc -c < main.min.js) Bytes"

  ####################################### RELEASING #######################################
  release-full:
    desc: Commit all, bump minor version and add tag, push to remote, create release with assets files.
    aliases: [deploy, ship, publish]
    interactive: true
    cmds:
      - git add .
      - task: bump-minor
      - task: release

  bump-patch:
    desc: "Bump package patch version (0.0.x)"
    aliases: [patch]
    cmd: npm version patch -f

  bump-minor:
    desc: "Bump package minor version (0.x.0)"
    aliases: [minor, bump]
    cmd: npm version minor -f

  release:
    desc: "Push version bump commit and tag to repository and create a new release on GitHub"
    requires:
      vars: [VERSION, PLUGIN_NAME, FILES]
    cmds: # Requires you to have bumped version, commited changes and added new tag
      - git push
      - git push --tags
      - task: release-create

  release-create:
    vars:
      VERSION:
        sh: node -e "console.log(require('./package.json').version)"
    cmd: gh release create {{.VERSION}} --title "{{.VERSION}}" --notes "New release of the {{.PLUGIN_NAME}} plugin for Obsidian." {{.FILES | join " "}}

  release-force:
    desc: "Overwrite an existing release and tag on GitHub"
    cmds:
      - gh release delete {{.VERSION}} --yes # 1. Delete the release from GitHub
      - git push --delete origin {{.VERSION}} # 2. Delete the tag from GitHub (remote)
      - git tag -d {{.VERSION}} # 3. Delete the tag locally (so it can be recreated)
      - git tag {{.VERSION}} # 4. Re-tag at the current commit
      - git push origin {{.VERSION}} --force # 5. Push the new tag and create the fresh release
      - task: release-create

  ####################################### UTILS #######################################
  initialize:
    desc: "Set up dev environment, make sure to create .env file"
    aliases: [init, initialize]
    cmds:
      - npm install
      # - cp .env-example .env
      - echo AN{{.AUTHOR_NAME}}
      - printf '\033[35m%s\033[0m\n' "Create .env with 'cp .env-example .env' and enter VAULTS_DIR and VAULT_NAME now"

  patch-obsidian:
    desc: Patches node_modules/obsidian/obsidian.d.ts to fix moment import
    cmd: sed -i 's/import \* as Moment from '\''moment'\'';/import Moment from '\''moment'\'';/g' node_modules/obsidian/obsidian.d.ts
    status: # Only execute if necessary
      - grep -q "import Moment from 'moment';" node_modules/obsidian/obsidian.d.ts

  date:
    desc: Print current date
    silent: true
    cmds: # Date format: 2006-01-02 15:04:05
      - echo "Finished at {{now | date "2006-01-02 15:04:05"}}"

  time: date +%T

  test:
    silent: true
    cmds:
      - "echo Time {{.TIME}}"
      - "echo 'Package version: {{.VERSION}}'"
      - echo {{join " " .FILES}}
      - for: { var: FILES }
        cmd: echo "cp '{{.ITEM}}' '{{.DIR_PLUGIN}}/{{.ITEM}}'"
      - "echo Time {{.TIME}}"
